name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, but do NOT cancel one that's already running: a
# publish that's mid-flight should be allowed to finish, and cancelling was
# killing deploys that were only waiting their turn for a runner. Newer
# QUEUED runs still supersede older queued ones, so nothing piles up — this
# matches GitHub's own recommended setting for Pages deployments.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages polls the Pages backend and aborts after 10 minutes by
          # default. Deployments have been sitting in `deployment_queued` past
          # that and getting cancelled seconds-to-minutes before they'd have
          # landed, so give the backend room instead of throwing the publish
          # away. 30 min of polling, inside a 45 min job ceiling.
          timeout: 1800000
          # a single transient API blip shouldn't end the whole publish
          error_count: 20
